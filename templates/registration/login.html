{% extends 'base.html' %}
{% load static %}
{% block title %}Ingresar{% endblock %}
{% block cuerpo %}
<div class="pantalla-ingreso">
    <div class="card">
        <div class="card-body">
            <div class="text-center mb-4">
                <img src="{% static 'img/logo.png' %}" alt="Servinorte">
                <div class="text-muted small mt-2">Cotizador de servicios de turismo</div>
            </div>
            {% if form.errors %}<div class="alert alert-danger py-2"><i class="bi bi-exclamation-triangle"></i> Usuario o contraseña incorrectos.</div>{% endif %}
            <form method="post">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label small fw-semibold" for="id_username">Usuario</label>
                    <div class="input-group">
                        <span class="input-group-text bg-white"><i class="bi bi-person text-primary"></i></span>
                        <input class="form-control" type="text" name="username" id="id_username" autofocus required autocomplete="username">
                    </div>
                </div>
                <div class="mb-4">
                    <label class="form-label small fw-semibold" for="id_password">Contraseña</label>
                    <div class="input-group">
                        <span class="input-group-text bg-white"><i class="bi bi-lock text-primary"></i></span>
                        <input class="form-control" type="password" name="password" id="id_password" required autocomplete="current-password">
                    </div>
                </div>
                <input type="hidden" name="next" value="{{ next }}">
                <button class="btn btn-primary w-100 py-2" type="submit">Ingresar <i class="bi bi-arrow-right"></i></button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
